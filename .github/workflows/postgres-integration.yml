name: PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudexify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudexify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudexify_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply initial schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/001_initial_schema.sql
      - name: Apply authentication policy migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_auth_identity_context.sql
      - name: Apply node enrollment migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_node_enrollment.sql
      - name: Apply node heartbeat migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_node_heartbeat.sql
      - name: Apply safe node jobs migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_safe_node_jobs.sql
      - name: Apply fair job scheduling migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_fair_job_scheduling.sql
      - name: Apply resource admission migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_resource_admission.sql
      - name: Apply runtime capability heartbeat migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_runtime_capability_heartbeat.sql
      - name: Apply deployment job orchestration migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_deployment_job_orchestration.sql
      - name: Apply deployment health checks migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_deployment_health_checks.sql
      - name: Apply deployment lifecycle jobs migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_deployment_lifecycle_jobs.sql
      - name: Apply durable runtime reconciliation migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_durable_runtime_reconciliation.sql
      - name: Apply automatic deployment rollback migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_automatic_deployment_rollback.sql
      - name: Apply runtime endpoint registration migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_runtime_endpoint_registration.sql
      - name: Apply tenant-scoped domain claims migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_domain_claims.sql
      - name: Apply deployment domain route registry migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/016_deployment_domain_route_registry.sql
      - name: Apply node mTLS tunnel certificate migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/017_node_tunnel_certificates.sql
      - name: Apply active ingress route gate migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/018_activate_ingress_routes.sql
      - name: Apply ingress route endpoint version migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/019_ingress_route_endpoint_version.sql
      - name: Apply node ingress drain state migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/020_node_ingress_drain_state.sql
      - name: Apply persistent application volumes migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/021_persistent_application_volumes.sql
      - name: Verify node ingress drain state
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/node-ingress-drain.integration.sql
      - name: Verify persistent application volumes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/persistent-volumes.integration.sql
      - name: Run PostgreSQL integration checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/rls.integration.sql
      - name: Verify runtime capability heartbeat
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/runtime-capabilities.integration.sql
      - name: Verify fair job distribution
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/job-scheduling.integration.sql
      - name: Verify concurrent node job claims
        run: bash tests/postgres/concurrent-job-claim.integration.sh
      - name: Verify resource admission and reservations
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/resource-admission.integration.sql
      - name: Verify deployment job orchestration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/deployment-job-orchestration.integration.sql
      - name: Verify durable runtime reconciliation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/durable-runtime-reconciliation.integration.sql
      - name: Verify automatic deployment rollback
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/automatic-deployment-rollback.integration.sql
      - name: Verify runtime endpoint registration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/runtime-endpoint-registration.integration.sql
      - name: Verify domain claims and DNS challenge lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/domain-claims.integration.sql
      - name: Verify deployment domain route registry
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/deployment-domain-route-registry.integration.sql
      - name: Verify node mTLS tunnel certificate authorization
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/node-tunnel-certificates.integration.sql
      - name: Run application tests
        run: npm test
